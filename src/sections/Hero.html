<!-- HERO SECTION -->
  <section id="hero" class="relative pt-28 sm:pt-36 pb-16 sm:pb-24 px-4 sm:px-8 overflow-hidden bg-n100">
    <!-- Decorative subtle grid & ambient glow -->
    <!-- Full-bleed ambient video; the heading and buttons stay above it. -->
    <div class="nordix-hero-video" aria-hidden="true">
      <video class="nordix-hero-video-player" autoplay muted loop playsinline preload="auto" tabindex="-1">
        <source src="__NORDIX_FRIDGE_VIDEO__" type="video/mp4" />
      </video>
    </div>
    <div class="hero-layout relative">
      
      <!-- Top Status Pill -->
      <div class="hero-status reveal-up flex flex-wrap items-center justify-between gap-4 mb-8 sm:mb-12">
        <div class="inline-flex items-center gap-3 px-4 py-2 rounded-full bg-n300 border border-n500">
          <span class="w-2.5 h-2.5 rounded-full bg-semantic pulse-accent"></span>
          <span class="text-xs sm:text-sm font-extrabold uppercase tracking-wider text-n800">
            Электромонтаж • Промышленный холод • Компрессоры
          </span>
        </div>
      </div>

      <!-- Massive Oversized Typography Hero -->
      <div class="relative z-10">
        <h1 class="hero-title font-display font-black uppercase text-n900 tracking-tight" aria-label="Держим холод под контролем">
          <span class="block reveal-up" style="transition-delay: 80ms;">ДЕРЖИМ</span>
          <span class="flex flex-wrap items-center gap-4 sm:gap-7 my-2 sm:my-3 reveal-up" style="transition-delay: 180ms;">
            <span class="inline-flex items-center justify-center bg-n900 px-5 sm:px-8 py-3 sm:py-5 rounded-2xl sm:rounded-[2rem] shadow-2xl animate-float">
              <!-- Undistorted Original Logo -->
              <img 
                src="https://www.designarena.ai/u/7aac2bcc-cf37-4e59-97c7-bbe3985cf939" 
                alt="Символ бесконечности NORDIX" 
                class="h-10 sm:h-16 md:h-20 lg:h-24 w-auto object-contain block"
              />
            </span>
            <span class="text-accent">ХОЛОД</span>
          </span>
          <span class="block reveal-up text-n800" style="transition-delay: 280ms;">ПОД</span>
          <span class="block reveal-up text-n800" style="transition-delay: 340ms;">КОНТРОЛЕМ</span>
        </h1>
      </div>

      <!-- Hero introduction -->
      <div class="hero-intro mt-10 sm:mt-16 max-w-3xl">
        <div class="reveal-up" style="transition-delay: 360ms;">
          <p class="text-xl sm:text-2xl md:text-3xl font-semibold text-n800 leading-snug">
            Разбирай железо, изучай схемы и прокачивай навыки. Всё о технологиях холода — без лишней воды.
          </p>
          <div class="mt-8 flex flex-wrap items-center gap-4">
            <a href="#directions" data-transition="КАТАЛОГ ПРОГРАММ" class="nav-transition mag-btn px-8 py-5 rounded-full bg-n900 hover:bg-accent text-n0 font-display font-bold text-sm sm:text-base uppercase tracking-wider inline-flex items-center gap-3 shadow-xl">
              <span>Выбрать модуль</span>
              <i data-lucide="arrow-down-right" class="w-5 h-5"></i>
            </a>
            <button onclick="openVideoModal()" class="mag-btn px-7 py-5 rounded-full bg-n300 hover:bg-n400 border border-n500 text-n900 font-bold text-base inline-flex items-center gap-3">
              <span class="w-8 h-8 rounded-full bg-semantic text-n0 flex items-center justify-center">
                <i data-lucide="play" class="w-4 h-4 fill-current ml-0.5"></i>
              </span>
              <span>Что будем изучать</span>
            </button>
          </div>
        </div>


      </div>

    </div>
  </section>
